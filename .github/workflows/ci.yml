name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  typecheck-build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build with tsdown
        run: npm run build

      - name: Verify CLI executable
        run: |
          ls -la dist/
          node ./dist/cli.js --version
          node ./dist/cli.js create --help

      - name: Smoke test - create project with defaults
        run: |
          mkdir -p /tmp/smartbi-smoke
          cd /tmp/smartbi-smoke
          node $GITHUB_WORKSPACE/dist/cli.js create smoke-test -y -f --alias "CI测试" --desc "CI Smoke Test"
          echo "--- Generated files ---"
          ls -la smoke-test/
          echo "--- extension.xml name attribute ---"
          grep -E '<extension name=' smoke-test/src/web/META-INF/extension.xml
          [ -f "smoke-test/build.xml" ] && echo "✓ build.xml"
          [ -f "smoke-test/.project" ] && echo "✓ .project"
          [ -f "smoke-test/.classpath" ] && echo "✓ .classpath"
          [ -f "smoke-test/src/web/META-INF/extension.xml" ] && echo "✓ extension.xml"
          [ -f "smoke-test/src/web/META-INF/applicationContext.xml" ] && echo "✓ applicationContext.xml"
          [ -f "smoke-test/src/web/META-INF/portlet.xml" ] && echo "✓ portlet.xml"
          [ -f "smoke-test/src/web/vision/js/ext/ConfigurationPatch.js" ] && echo "✓ ConfigurationPatch.js"
          [ -d "smoke-test/src/web/META-INF/classes" ] && echo "✓ classes dir"
          [ -d "smoke-test/src/web/META-INF/lib" ] && echo "✓ lib dir"

      - name: Run tests
        run: npm test || true

      - name: Verify package files structure
        run: |
          echo "Checking dist outputs..."
          [ -f "dist/cli.js" ] && echo "✓ dist/cli.js"
          [ -f "dist/index.js" ] && echo "✓ dist/index.js"
          [ -f "dist/index.d.ts" ] && echo "✓ dist/index.d.ts"
          echo "Checking source files..."
          [ -f "src/cli.ts" ] && echo "✓ src/cli.ts"
          [ -f "src/index.ts" ] && echo "✓ src/index.ts"
          [ -f "src/commands/create.ts" ] && echo "✓ src/commands/create.ts"
          [ -f "src/utils/check-version.ts" ] && echo "✓ src/utils/check-version.ts"
          [ -f "src/types.ts" ] && echo "✓ src/types.ts"
          [ -f "tsconfig.json" ] && echo "✓ tsconfig.json"
          [ -f "tsdown.config.ts" ] && echo "✓ tsdown.config.ts"

  dry-run-publish:
    needs: typecheck-build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Dry run publish
        run: npm publish --dry-run
