name: Publish Package to npmjs

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build with tsdown (runs automatically via prepublishOnly as well)
        run: npm run build

      - name: Run tests
        run: npm test || true

      - name: Smoke test CLI
        run: |
          node ./dist/cli.js --version
          mkdir -p /tmp/release-smoke
          cd /tmp/release-smoke
          node $GITHUB_WORKSPACE/dist/cli.js create smoke-ext -y -f
          [ -f "smoke-ext/build.xml" ] || exit 1
          [ -f "smoke-ext/src/web/META-INF/extension.xml" ] || exit 1
          echo "✓ CLI smoke test passed"

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Publishing version: $TAG_NAME"

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "import('./package.json').then(m => m.default.version)")
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PKG_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Verify dist contents before publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Dist contents:"
          ls -la dist/
          [ -f "dist/cli.js" ] || { echo "Missing dist/cli.js"; exit 1; }
          head -1 dist/cli.js | grep -q '#!/usr/bin/env node' || { echo "Shebang missing in cli.js"; exit 1; }
          [ -f "dist/index.js" ] || { echo "Missing dist/index.js"; exit 1; }
          echo "✓ dist contents OK"

      - name: Publish to npm (latest)
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (prerelease)
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-')
        run: npm publish --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          name: Release v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
