# This workflow will run typecheck, build and smoke tests, then publish the package to npm
# Reference: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-26-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-26-npm-
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Verify build artifacts
        run: |
          set -e
          [ -f "dist/cli.js" ]
          [ -f "dist/index.js" ]
          [ -f "dist/index.d.ts" ]
          head -1 dist/cli.js | grep -q "#!/usr/bin/env node"
          node dist/cli.js --version | grep -qE 'v[0-9]+\.[0-9]+\.[0-9]+'
      - name: Validate published tarball
        run: |
          set -e
          TMPDIR=$(mktemp -d)
          npm pack --pack-destination "$TMPDIR" --no-audit --no-fund > /dev/null
          TARBALL=$(ls "$TMPDIR"/*.tgz | head -1)
          echo "Packed tarball: $TARBALL"
          tar -xzf "$TARBALL" -C "$TMPDIR"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('$TMPDIR/package/package.json','utf8'));
            if (!p.bin || !p.bin.smartbi) {
              console.error('FAIL: bin.smartbi missing in packed package.json! bin =', JSON.stringify(p.bin));
              process.exit(1);
            }
            if (!fs.existsSync('$TMPDIR/package/' + p.bin.smartbi)) {
              console.error('FAIL: bin target file does not exist in tarball: ' + p.bin.smartbi);
              process.exit(1);
            }
            console.log('OK: bin.smartbi =', p.bin.smartbi);
            console.log('OK: repository =', p.repository.url);
          "
          rm -rf "$TMPDIR"
      - name: CLI smoke test
        run: |
          set -e
          rm -rf /tmp/smartbi-smoke && mkdir -p /tmp/smartbi-smoke
          node dist/cli.js create SmokeExt -y -f -C /tmp/smartbi-smoke --desc 'x&y<z"quote'
          cd /tmp/smartbi-smoke/SmokeExt
          for f in build.xml .project .classpath \
            src/web/META-INF/extension.xml \
            src/web/WEB-INF/web.xml; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
          grep -qE '<extension[[:space:]]+name="SmokeExt"' src/web/META-INF/extension.xml
          grep -qE 'alias="SmokeExt"' src/web/META-INF/extension.xml
          grep -qE 'desc="x&amp;y&lt;z&quot;quote"' src/web/META-INF/extension.xml

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Skip if this version already published
        id: check-version
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          REMOTE="$(npm view smartbi@"$VERSION" version 2>/dev/null)"
          if [ "$REMOTE" = "$VERSION" ]; then
            echo "Version $VERSION is already published on npm. Skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not yet published. Will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check-version.outputs.skip == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
