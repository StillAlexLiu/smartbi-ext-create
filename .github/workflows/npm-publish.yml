# This workflow will run typecheck, build and smoke tests, then publish the package to npm
# Reference: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-26-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-26-npm-
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Verify build artifacts
        run: |
          set -e
          [ -f "dist/cli.js" ]
          [ -f "dist/index.js" ]
          [ -f "dist/index.d.ts" ]
          head -1 dist/cli.js | grep -q "#!/usr/bin/env node"
          node dist/cli.js --version | grep -qE 'v[0-9]+\.[0-9]+\.[0-9]+'
      - name: Validate published tarball
        run: |
          set -e
          TMPDIR=$(mktemp -d)
          npm pack --pack-destination "$TMPDIR" --no-audit --no-fund > /dev/null
          TARBALL=$(ls "$TMPDIR"/*.tgz | head -1)
          echo "Packed tarball: $TARBALL"
          tar -xzf "$TARBALL" -C "$TMPDIR"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('$TMPDIR/package/package.json','utf8'));
            if (p.name !== 'smartbi-ext') { console.error('FAIL: expected package.name smartbi-ext, got', p.name); process.exit(1); }
            if (!p.bin || !p.bin.smartbi) { console.error('FAIL: bin.smartbi missing! bin =', JSON.stringify(p.bin)); process.exit(1); }
            if (!fs.existsSync('$TMPDIR/package/' + p.bin.smartbi)) { console.error('FAIL: bin target missing:', p.bin.smartbi); process.exit(1); }
            console.log('OK: package.name =', p.name, 'version =', p.version);
            console.log('OK: bin.smartbi =', p.bin.smartbi);
            console.log('OK: repository =', p.repository.url);
            console.log('OK: publishConfig =', JSON.stringify(p.publishConfig));
          "
          rm -rf "$TMPDIR"
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Skip if this version already published
        id: check-version
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          REMOTE="$(npm view smartbi-ext@"$VERSION" version 2>/dev/null)"
          if [ "$REMOTE" = "$VERSION" ]; then
            echo "Version smartbi-ext@$VERSION is already published. Skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version smartbi-ext@$VERSION not yet published. Will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check-version.outputs.skip == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
